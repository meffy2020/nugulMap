name: Verify and Deploy Backend

on:
  pull_request:
    paths:
      - "backend/api-server/**"
      - "backend/data-scripts/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "backend/api-server/**"
      - "backend/data-scripts/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/meffy2020/nugulmap-backend

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/api-server/*.gradle*

      - name: Run backend tests
        working-directory: backend/api-server
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

      - name: Verify production profile on disposable MySQL 8
        run: |
          docker pull mysql:8.0
          python3 scripts/verify-local-release-stack.py

      - name: Verify smoking-only release and production Compose contracts
        run: |
          touch backend/api-server/.env.local
          python3 -m unittest discover -s scripts/tests
          python3 backend/api-server/scripts/test_check_production_compose_security.py
          python3 backend/api-server/scripts/check-production-compose-security.py

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable backend image
        uses: docker/build-push-action@v5
        with:
          context: backend/api-server
          file: backend/api-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require EC2 deployment credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MODERATION_CONTACT_EMAIL: ${{ secrets.MODERATION_CONTACT_EMAIL }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing repository secret: SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          if [ -z "$MODERATION_CONTACT_EMAIL" ]; then
            echo "Missing production environment secret: MODERATION_CONTACT_EMAIL" >&2
            exit 1
          fi

      - name: Deploy immutable image with health rollback
        id: deploy_app
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          API_SERVER_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODERATION_CONTACT_EMAIL: ${{ secrets.MODERATION_CONTACT_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST || 'api.nugulmap.com' }}
          username: ${{ secrets.SSH_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: API_SERVER_IMAGE,SOURCE_SHA,DEPLOYMENT_ID,GHCR_USERNAME,GHCR_TOKEN,MODERATION_CONTACT_EMAIL
          command_timeout: 15m
          script: |
            set -eu
            cd ~/nugulMap
            git fetch origin main
            git checkout --detach "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

            requested_image="$API_SERVER_IMAGE"
            requested_moderation_contact_email="$MODERATION_CONTACT_EMAIL"
            set -a
            . backend/api-server/.env.local
            set +a
            API_SERVER_IMAGE="$requested_image"
            MODERATION_CONTACT_EMAIL="$requested_moderation_contact_email"
            export API_SERVER_IMAGE MODERATION_CONTACT_EMAIL

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d mysql
            mysql_healthy=false
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.yml -f docker-compose.production.yml \
                exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -uroot --silent'; then
                mysql_healthy=true
                break
              fi
              sleep 5
            done
            if [ "$mysql_healthy" != true ]; then
              echo "MySQL did not become healthy; deployment stopped before application restart" >&2
              exit 1
            fi

            backup_dir="$HOME/nugulMap-backups"
            backup_path="$backup_dir/predeploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            backup_sql_path="${backup_path%.gz}"
            umask 077
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump --single-transaction --routines --triggers -uroot "$MYSQL_DATABASE"' \
              > "$backup_sql_path"
            test -s "$backup_sql_path"
            gzip -9 "$backup_sql_path"
            test -s "$backup_path"
            chmod 600 "$backup_path"
            gzip -t "$backup_path"
            find "$backup_dir" -type f -name 'predeploy-*.sql.gz' -mtime +14 -delete

            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/schema.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260710_launch_safety.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260711_apple_token_storage.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260711_ugc_publication_safety.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260712_support_request_retention.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260712_moderation_report_retention.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260901_recommendation_data_foundation.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260901_recommendation_data_limits.sql
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260901_location_letters.sql
            # Preserve demo records while removing their public routing visibility.
            remaining_demo_zones=$(docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE"' \
              < backend/api-server/src/main/resources/db/manual/20260907_quarantine_demo_zones.sql)
            test "$remaining_demo_zones" -eq 0
            echo "published exact demo zones remaining: $remaining_demo_zones"
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"user_block\",\"zone_review_report\",\"zone_report\",\"support_request\");"); test "$count" -eq 4; echo "launch-safety tables: $count/4"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"user_preference\",\"user_saved_item\",\"recommendation_interaction\");"); test "$count" -eq 3; echo "recommendation tables: $count/3"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name=\"recommendation_interaction\" AND index_name=\"uk_rec_interaction_event\" AND non_unique=0;"); test "$count" -eq 6; echo "recommendation interaction idempotency index entries: $count/6"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name=\"recommendation_interaction\" AND index_name=\"idx_rec_interaction_occurred\";"); test "$count" -eq 1; echo "recommendation interaction retention index entries: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name=\"user_saved_item\" AND index_name=\"uk_user_saved_item_key\" AND non_unique=0;"); test "$count" -eq 4; echo "recommendation saved-item unique index entries: $count/4"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN (\"fk_user_preference_user\",\"fk_user_saved_item_user\",\"fk_rec_interaction_user\") AND delete_rule=\"CASCADE\" AND update_rule=\"CASCADE\";"); test "$count" -eq 3; echo "recommendation cascade foreign keys: $count/3"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"location_letter\",\"location_letter_like\",\"location_letter_report\");"); test "$count" -eq 3; echo "location letter tables: $count/3"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"location_letter_report\" AND column_name=\"resolved_at\";"); test "$count" -eq 1; echo "location letter moderation retention column: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN (\"fk_location_letter_author\",\"fk_location_letter_like_letter\",\"fk_location_letter_like_user\",\"fk_location_letter_report_letter\",\"fk_location_letter_report_reporter\") AND delete_rule=\"CASCADE\" AND update_rule=\"CASCADE\";"); test "$count" -eq 5; echo "location letter cascade foreign keys: $count/5"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"users\" AND column_name=\"apple_refresh_token_ciphertext\";"); test "$count" -eq 1; echo "Apple token storage column: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"zone\" AND column_name=\"publication_status\";"); test "$count" -eq 1; echo "zone publication_status column: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"zone_review\" AND column_name=\"author_id\" AND is_nullable=\"YES\";"); test "$count" -eq 1; echo "nullable review author column: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND table_name=\"zone_review\" AND constraint_name=\"fk_zone_review_author\" AND delete_rule=\"SET NULL\";"); test "$count" -eq 1; echo "review author delete rule: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=\"support_request\" AND column_name=\"resolved_at\";"); test "$count" -eq 1; echo "support retention column: $count/1"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name=\"support_request\" AND index_name=\"idx_support_request_status_resolved\";"); test "$count" -ge 1; echo "support retention index entries: $count"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name IN (\"zone_review_report\",\"zone_report\") AND column_name=\"resolved_at\";"); test "$count" -eq 2; echo "moderation retention columns: $count/2"'
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              exec -T mysql sh -ec 'count=$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --batch --skip-column-names -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(DISTINCT CONCAT(table_name, \"/\", index_name)) FROM information_schema.statistics WHERE table_schema=DATABASE() AND ((table_name=\"zone_review_report\" AND index_name=\"idx_zone_review_report_status_resolved\") OR (table_name=\"zone_report\" AND index_name=\"idx_zone_report_status_resolved\"));"); test "$count" -eq 2; echo "moderation retention indexes: $count/2"'

            # Stop an older discovery collector when upgrading to the smoking-only release.
            docker compose -f docker-compose.yml -f docker-compose.production.yml --profile discovery stop popup-trend-collector

            rollback_state_dir="$HOME/.nugulmap-deploy"
            rollback_state_file="$rollback_state_dir/$DEPLOYMENT_ID.previous-image"
            mkdir -p "$rollback_state_dir"
            chmod 700 "$rollback_state_dir"

            previous_image=$(docker inspect --format '{{.Config.Image}}' neogul-map-api 2>/dev/null || true)
            rollback_state_tmp="$rollback_state_file.tmp"
            printf '%s\n' "$previous_image" > "$rollback_state_tmp"
            chmod 600 "$rollback_state_tmp"
            mv "$rollback_state_tmp" "$rollback_state_file"

            rollback_api() {
              if [ -n "$previous_image" ]; then
                API_SERVER_IMAGE="$previous_image" \
                  docker compose -f docker-compose.yml -f docker-compose.production.yml \
                  up -d --no-build api-server || return 1

                rollback_healthy=false
                for attempt in $(seq 1 30); do
                  if curl --fail --silent http://127.0.0.1:8080/api/actuator/health \
                    | grep -q '"status":"UP"'; then
                    rollback_healthy=true
                    break
                  fi
                  sleep 10
                done
                [ "$rollback_healthy" = true ] || return 1
                echo "Previous API image restored: $previous_image"
                return 0
              fi

              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                stop api-server >/dev/null 2>&1 || true
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                rm -f api-server >/dev/null 2>&1 || true
              echo "No previous API image existed; failed first-deploy container removed"
            }

            deploy_api() {
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                pull api-server || return 1
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                up -d --no-build api-server || return 1

              healthy=false
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8080/api/actuator/health \
                  | grep -q '"status":"UP"'; then
                  healthy=true
                  break
                fi
                sleep 10
              done
              [ "$healthy" = true ]
            }

            if ! deploy_api; then
              echo "Deployment failed local health verification; starting rollback" >&2
              if ! rollback_api; then
                echo "Automatic rollback failed; rollback state retained at $rollback_state_file" >&2
                exit 1
              fi
              rm -f "$rollback_state_file"
              exit 1
            fi

      - name: Verify public health endpoint
        id: public_health
        run: |
          healthy=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              https://api.nugulmap.com/api/actuator/health \
              | grep -q '"status":"UP"'; then
              healthy=true
              break
            fi
            sleep 10
          done
          test "$healthy" = true

      - name: Roll back when public health verification fails
        if: always() && steps.deploy_app.outcome == 'success' && steps.public_health.outcome != 'success'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          API_SERVER_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MODERATION_CONTACT_EMAIL: ${{ secrets.MODERATION_CONTACT_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST || 'api.nugulmap.com' }}
          username: ${{ secrets.SSH_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: API_SERVER_IMAGE,DEPLOYMENT_ID,MODERATION_CONTACT_EMAIL
          command_timeout: 10m
          script: |
            set -eu
            cd ~/nugulMap

            requested_image="$API_SERVER_IMAGE"
            requested_moderation_contact_email="$MODERATION_CONTACT_EMAIL"
            set -a
            . backend/api-server/.env.local
            set +a
            API_SERVER_IMAGE="$requested_image"
            MODERATION_CONTACT_EMAIL="$requested_moderation_contact_email"
            export API_SERVER_IMAGE MODERATION_CONTACT_EMAIL

            rollback_state_file="$HOME/.nugulmap-deploy/$DEPLOYMENT_ID.previous-image"
            test -f "$rollback_state_file"
            previous_image=$(cat "$rollback_state_file")

            if [ -n "$previous_image" ]; then
              API_SERVER_IMAGE="$previous_image" \
                docker compose -f docker-compose.yml -f docker-compose.production.yml \
                up -d --no-build api-server

              rollback_healthy=false
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:8080/api/actuator/health \
                  | grep -q '"status":"UP"'; then
                  rollback_healthy=true
                  break
                fi
                sleep 10
              done
              test "$rollback_healthy" = true
              echo "Public health failed; previous API image restored: $previous_image"
            else
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                stop api-server >/dev/null 2>&1 || true
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                rm -f api-server >/dev/null 2>&1 || true
              echo "Public health failed on first deploy; failed API container removed"
            fi

            rm -f "$rollback_state_file"

      - name: Finalize successful deployment
        if: steps.public_health.outcome == 'success'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SSH_HOST || 'api.nugulmap.com' }}
          username: ${{ secrets.SSH_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOYMENT_ID
          command_timeout: 5m
          script: |
            set -eu
            rm -f "$HOME/.nugulmap-deploy/$DEPLOYMENT_ID.previous-image"
            docker image prune -f
